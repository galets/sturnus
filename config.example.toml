listen = "127.0.0.1:4000"

# Optional second listener serving only /metrics, /health, /healthz, /status.
# Bind to a routable address so Prometheus can scrape while the proxy stays on loopback.
# metrics_listen = "0.0.0.0:4040"

# Optional caller-facing keys. When present, every proxied request must carry
# one in `Authorization: Bearer <key>` or it is answered with 401. The
# observability routes (/health, /healthz, /status, /metrics) stay keyless.
# Leave it out entirely for an open proxy; an empty list is a startup error.
# api_keys = ["${STURNUS_API_KEY}"]

# Providers: where to send requests

[provider.openai]
base_url = "https://api.openai.com/v1"
api_key = "${OPENAI_API_KEY}"

[provider.groq]
base_url = "https://api.groq.com/openai/v1"
api_key = "${GROQ_API_KEY}"

[provider.local-vllm]
base_url = "http://localhost:8000/v1"

# Vertex AI via GKE Workload Identity (no API key needed)
[provider.vertex]
vertex_ai = { project_id = "my-gcp-project", location = "us-central1" }

# location also accepts "global" and the "us" / "eu" multi-regions.
# Any provider takes extra headers, sent on every request to it.
# [provider.vertex-eu]
# vertex_ai = { project_id = "my-gcp-project", location = "eu" }
# headers = { "X-Vertex-AI-LLM-Request-Type" = "dedicated" }

# Vertex AI with API key (uses Bearer auth instead of GCP metadata server)
# [provider.vertex-key]
# api_key = "${VERTEX_API_KEY}"
# vertex_ai = { project_id = "my-gcp-project", location = "us-central1" }

# Azure OpenAI (api-key header, deployment-based URL)
[provider.azure]
api_key = "${AZURE_OPENAI_KEY}"
azure_openai = { resource_name = "my-resource", api_version = "2024-10-21" }

# Google AI Studio (API key as query parameter)
[provider.gemini]
api_key = "${GEMINI_API_KEY}"
google_ai = { api_version = "v1beta" }  # api_version defaults to v1beta

# Anthropic (OpenAI compatibility endpoint)
[provider.anthropic]
api_key = "${ANTHROPIC_API_KEY}"
anthropic = { version = "2023-06-01" }  # version defaults to 2023-06-01

# Model map: aliases the client uses → provider+model candidates
[model]
fast = [
  { provider = "groq", model = "llama-3.3-70b-versatile" },
  { provider = "openai", model = "gpt-4o-mini" },
]

smart = [
  { provider = "openai", model = "gpt-4.1" },
  { provider = "vertex", model = "google/gemini-2.5-flash" },
  { provider = "azure", model = "gpt-4o" },              # deployment name in Azure
  { provider = "anthropic", model = "claude-sonnet-4-20250514" },
  { provider = "local-vllm", model = "qwen3-32b" },
]

code = [
  { provider = "openai", model = "gpt-4.1" },
  { provider = "groq", model = "llama-3.3-70b-versatile" },
  { provider = "local-vllm", model = "qwen-coder-32b" },
]

[routing]
ewma_alpha = 0.3          # EWMA smoothing factor (higher = more reactive)
exploit_k = 3.0            # exploit sharpness: how strongly the best candidate is preferred (see the table below)
error_threshold = 0.5      # error-rate EWMA above which a session-affinity pin is broken (routing weights are unaffected)
connect_timeout_secs = 10  # max seconds to establish upstream connection
read_timeout_secs = 60     # max seconds between chunks before treating upstream as hung

# exploit_k is the exponent in each candidate's weight:
# round(1000 * (best_effective / its_effective)^exploit_k), floored at 10 units
# (1% of the best candidate's), where effective latency is the latency EWMA
# over the success-rate EWMA, multiplied by (1 + in-flight requests) so a busy
# candidate is scored on the wait it would impose. A candidate's share of its
# alias is its weight over the alias's total weight. Nothing is in flight in the
# table below: the queue factor is 1 at in_flight = 0, so each row is the split
# between two idle candidates waiting to be compared. One carrying n requests is
# scored (1 + n)x slower than its row and its share shrinks until it drains:
#
#   worse candidate    k = 3.0 (default)   k = 1.0    k = 0.0
#   2x slower          11.1%               33.3%      50%
#   5x slower          1.0%                16.7%      50%
#   hard-failing       1.0%                1.0%       50%
#
# Each 1.0% is the probe floor (10 units of 1010), not the formula's own
# number. Raising the exponent favours the best candidate; lowering it spreads
# traffic to an underutilized one. k = 0 raises every ratio to the power 0, so
# the split is even and errors stop counting entirely: a hard-failing candidate
# keeps half the alias's traffic. And because the queue adjustment lives inside
# that ratio, k = 0 discards it too — a box carrying ten requests weighs exactly
# what its idle twin does, and a burst lands wherever the tick says. Values must
# be finite and >= 0.

# Vertex billing labels: merged into outbound bodies for any vertex_ai
# provider with `attribution = true` (add the flag to its vertex_ai
# block above). Sidecar wins on key collision.
# [attribution]
# service = "${SERVICE_NAME}"
# owner = "${OWNER}"
# env = "${ENV}"
