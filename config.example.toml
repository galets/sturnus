listen = "127.0.0.1:4000"

# Optional second listener serving only /metrics, /health, /healthz, /status.
# Bind to a routable address so Prometheus can scrape while the proxy stays on loopback.
# metrics_listen = "0.0.0.0:4040"

# Optional caller-facing keys. When present, every proxied request must carry
# one in `Authorization: Bearer <key>` or it is answered with 401. The
# observability routes (/health, /healthz, /status, /metrics) stay keyless.
# Leave it out entirely for an open proxy; an empty list is a startup error.
# api_keys = ["${STURNUS_API_KEY}"]

# Providers: where to send requests

[provider.openai]
base_url = "https://api.openai.com/v1"
api_key = "${OPENAI_API_KEY}"

[provider.groq]
base_url = "https://api.groq.com/openai/v1"
api_key = "${GROQ_API_KEY}"

[provider.local-vllm]
base_url = "http://localhost:8000/v1"

# Vertex AI via GKE Workload Identity (no API key needed)
[provider.vertex]
vertex_ai = { project_id = "my-gcp-project", location = "us-central1" }

# location also accepts "global" and the "us" / "eu" multi-regions.
# Any provider takes extra headers, sent on every request to it.
# [provider.vertex-eu]
# vertex_ai = { project_id = "my-gcp-project", location = "eu" }
# headers = { "X-Vertex-AI-LLM-Request-Type" = "dedicated" }

# Vertex AI with API key (uses Bearer auth instead of GCP metadata server)
# [provider.vertex-key]
# api_key = "${VERTEX_API_KEY}"
# vertex_ai = { project_id = "my-gcp-project", location = "us-central1" }

# Azure OpenAI (api-key header, deployment-based URL)
[provider.azure]
api_key = "${AZURE_OPENAI_KEY}"
azure_openai = { resource_name = "my-resource", api_version = "2024-10-21" }

# Google AI Studio (API key as query parameter)
[provider.gemini]
api_key = "${GEMINI_API_KEY}"
google_ai = { api_version = "v1beta" }  # api_version defaults to v1beta

# Anthropic (OpenAI compatibility endpoint)
[provider.anthropic]
api_key = "${ANTHROPIC_API_KEY}"
anthropic = { version = "2023-06-01" }  # version defaults to 2023-06-01

# Model map: aliases the client uses → provider+model candidates
#
# Each candidate takes an integer `weight` (default 1) declaring how much of
# the alias's traffic it should get: its share is its weight over the sum of
# the alias's weights. The weight is declared, never measured — the router
# does not probe, and a 95% share is written as `weight = 19` beside
# `weight = 1`.
[model]
fast = [
  { provider = "groq", model = "llama-3.3-70b-versatile", weight = 3 },
  { provider = "openai", model = "gpt-4o-mini", weight = 1 },
]

smart = [
  { provider = "openai", model = "gpt-4.1" },
  { provider = "vertex", model = "google/gemini-2.5-flash" },
  { provider = "azure", model = "gpt-4o" },              # deployment name in Azure
  { provider = "anthropic", model = "claude-sonnet-4-20250514" },
  { provider = "local-vllm", model = "qwen3-32b" },
]

code = [
  { provider = "openai", model = "gpt-4.1" },
  { provider = "groq", model = "llama-3.3-70b-versatile" },
  { provider = "local-vllm", model = "qwen-coder-32b" },
]

[routing]
ewma_alpha = 0.3          # EWMA smoothing factor (higher = more reactive)
demotion_secs = 10        # seconds a box takes no new sessions for after a
                          # transport failure (connect, DNS, TLS, connect
                          # timeout, read timeout). An upstream 4xx/5xx is
                          # relayed and does not demote. 0 asks for no window.
connect_timeout_secs = 10  # max seconds to establish upstream connection
read_timeout_secs = 60     # max seconds between chunks before treating upstream as hung

# Session pins: how long an `x-session-affinity` session key keeps its box.
# A session key's first turn is placed by weight; every later turn rides the
# pin, busy or not. A `provider/model` value in the same header is an explicit
# pin and never enters this table. Both bounds are a cost, not a safety
# margin: a session that crosses one places fresh, which is the cache miss
# affinity was bought to avoid. The TTL is a conversation-lifetime bound, not
# a cache-retention match — real prompt caches (5-10 min at one provider, 5
# min and 1 h tiers at another, memory-pressure eviction on self-hosted
# boxes) are shorter than this and no single number can track them. The limit
# is a memory bound on keys this process does not control.
session_ttl_secs = 1800     # seconds quiet before a session's pin is dropped
session_table_limit = 1024  # sessions held; the least recently used goes first

# The share a weight buys, for an alias of two candidates:
#
#   weights      preferred box   other box
#   1 : 1        50%             50%
#   2 : 1        66.7%           33.3%
#   3 : 1        75%             25%
#   19 : 1       95%             5%
#
# Weights allocate sessions, so the share of *turns* an operator sees drifts
# around the declared share of sessions; `/status` reports both. A candidate
# that should never serve is left out of the list, not weighted at zero.

# Vertex billing labels: merged into outbound bodies for any vertex_ai
# provider with `attribution = true` (add the flag to its vertex_ai
# block above). Sidecar wins on key collision.
# [attribution]
# service = "${SERVICE_NAME}"
# owner = "${OWNER}"
# env = "${ENV}"
